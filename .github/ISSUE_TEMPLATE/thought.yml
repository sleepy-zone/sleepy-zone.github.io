name: 发一条想法
description: 在手机上写一条短想法，提交后自动发布到 sleepyzone.online/thoughts
title: "[想法] "
labels: ["thought"]
body:
  - type: markdown
    attributes:
      value: |
        提交后会自动创建 Markdown、部署站点，并把这条 issue 关掉。
        正文支持 Markdown；图片可以直接粘贴/上传。
  - type: textarea
    id: content
    attributes:
      label: 想法
      description: 建议 300 字以内，不要写标题
      placeholder: 今天想到的一句话……
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: 标签
      description: 用逗号分隔，最多 3 个，可留空
      placeholder: ai, 产品
  - type: input
    id: project
    attributes:
      label: 关联项目 slug
      description: 可选，比如 fabritor、char-db-cn
      placeholder: fabritor
