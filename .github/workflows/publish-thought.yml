name: Publish thought from issue

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-thought
  cancel-in-progress: false

jobs:
  publish:
    if: |
      (contains(github.event.issue.labels.*.name, 'thought') || startsWith(github.event.issue.title, '[想法]')) &&
      (github.event.issue.author_association == 'OWNER' ||
       github.event.issue.author_association == 'MEMBER' ||
       github.event.issue.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      id: ${{ steps.create.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create thought file
        id: create
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: node scripts/thought-from-issue.mjs

      - name: Commit and push
        id: commit
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/thoughts
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "thought: issue #${ISSUE_NUMBER}"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Comment and close issue
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          THOUGHT_URL: ${{ steps.create.outputs.url }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `已发布：${process.env.THOUGHT_URL}\n\n部署约 1 分钟，完成后刷新站点即可。`,
            });
            await github.rest.issues.update({ owner, repo, issue_number, state: 'closed' });

  deploy:
    needs: publish
    if: needs.publish.outputs.changed == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/deploy.yml
