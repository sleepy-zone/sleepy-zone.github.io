mole:
  desc: 数十 GB のゴミや AI ツールの古いデータを整理し、アプリの削除・更新、ディスク分析、Mac の状態確認ができます。
  tag: システムユーティリティ
  imageAlt: Mole のダッシュボード
  sections:
    - title: できること
      items:
        - ゴミや AI ツールの古いデータを整理
        - アプリの削除・更新、ディスク使用量の分析
        - Mac の動作状況をリアルタイムで確認
    - title: 向いている人
      text: Mac の空き容量が少ない人、AI ツールやモデルをたくさん入れている人。
    - title: 使い方
      text: ディスク分析を確認してから整理し、削除・更新の対象を確認します。重要なデータはいつもどおりバックアップしてください。最新機能は公式サイトをご確認ください。
skillry:
  desc: センスのよい Agent Skills のコレクション。
  tag: Agent スキル
  imageAlt: Skillry
  sections:
    - title: これは何か
      text: Skillry は Agent Skills のコレクションで、公式サイトでは「センスのよい Agent Skills」と紹介されています。
    - title: 向いている人
      text: デザイン、フロントエンド、コンテンツ制作で Agent を使い、既存のスキルを再利用したい人。
    - title: 使い方
      text: 公式サイトで最新のスキルと用途を確認してください。

qwen-office:
  title: Qwen Office
  desc: "MiniMax M3.1 Flash が期間限定で無料。Qwen Office は文書・表計算・プレゼン・データ分析・リサーチに対応する AI オフィススイートです。"
  tag: AI オフィス
  imageAlt: Qwen Office ダウンロードページ
  platform: マルチプラットフォーム
  sections:
    - title: これは何か
      text: Qwen Office は個人・企業向けの AI オフィスプラットフォームで、文書、表計算、プレゼン、データ分析、リサーチに対応します。
    - title: 期間限定キャンペーン
      text: MiniMax M3.1 Flash が期間限定で無料。クライアントをダウンロードして試せます。期間と利用枠は公式サイトをご確認ください。
    - title: 向いている人
      text: 文書作成、表計算、プレゼン、データ分析、リサーチを行う人。Windows、macOS、HarmonyOS、Linux のデスクトップとモバイルに対応しています。
    - title: 使い方
      text: 公式ダウンロードページで OS を選んでインストールしてください。機能とキャンペーンは公式サイトの最新情報をご確認ください。
