fabritor:
  displayName: fabritor Image Editor
  desc: Open-source image editor built on fabric.js for quick collages, text and posters.
  imageAlt: fabritor editor
  detail:
    intro: "fabritor is an open-source image editor built on fabric.js. It runs in the browser and is great for quick collages, text overlays and simple posters."
    highlights:
      - "Built with fabric.js + React, runs in the browser"
      - "Open source; self-host or extend"
      - "Good for covers, social images and layouts"
    useCases:
      - "Make covers and social images"
      - "Turn several images into one layout"

woocs:
  displayName: woocs WeChat Markdown Editor
  desc: Desktop Markdown editor for WeChat articles, based on doocs/md.
  imageAlt: woocs editor
  detail:
    intro: "woocs is a desktop Markdown editor for WeChat articles. It is based on doocs/md and turns Markdown drafts into rich text you can paste into WeChat."
    highlights:
      - "Vue + Electron desktop app"
      - "WeChat formatting based on doocs/md"
      - "Import / export and keyboard shortcuts"
    useCases:
      - "Format WeChat articles"
      - "Turn Markdown notes into rich text"

photor:
  displayName: photor Screenshot Beautifier
  desc: Beautify screenshots with backgrounds and layouts on web, browser extension and uTools.
  imageAlt: photor screenshot editor
  detail:
    intro: "photor beautifies screenshots with gradient backgrounds, rounded corners and layout presets. It is available on the web, as a browser extension and as a uTools plugin."
    highlights:
      - "Web app, browser extension and uTools plugin"
      - "Gradient backgrounds, rounded corners and shadows"
      - "Built on fabric.js"
    useCases:
      - "Beautify tutorial and documentation screenshots"
      - "Make share images quickly"

